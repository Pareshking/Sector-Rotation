name: Jugaad Canonical Test

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_jugaad_canonical.py"
      - ".github/workflows/jugaad-canonical-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Jugaad-data
        run: python -m pip install --upgrade "jugaad-data==0.35.5" pyarrow pandas

      - name: Fetch and validate canonical histories
        run: python tools/fetch_jugaad_canonical.py

      - name: Upload Jugaad results
        uses: actions/upload-artifact@v4
        with:
          name: jugaad-canonical-test
          path: jugaad_output/
          if-no-files-found: error
          retention-days: 7
