name: Jugaad NSE Catalogue Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/catalogue_only.py"
      - ".github/workflows/jugaad-catalogue-only.yml"

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jugaad
        run: pip install jugaad-data==0.35.5
      - name: Discover NSE catalogue only
        run: python tools/catalogue_only.py
