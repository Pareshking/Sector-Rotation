name: Data Pipeline

on:
  # Scheduled only. The pipeline fetches five years of history for 47 indices
  # and 104 funds, which takes ~18 minutes; running it on every code push burnt
  # that for data that changes once a day, and a rapid sequence of pushes
  # cancelled its own refresh through the concurrency group below.
  # Use workflow_dispatch to refresh on demand after a pipeline change.
  schedule:
    # 04:00 IST = 22:30 UTC on the previous calendar day.
    # Runs every calendar day; the pipeline uses the latest available market
    # observation, so weekends and NSE holidays naturally fall back to the most
    # recent working day.
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: sector-rotation-data-pipeline-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live pipeline
        env:
          PIPELINE_MODE: live
        # --strict: an error-level quality alert (coverage regression, a
        # dropped canonical series, a truncated history) must stop the run
        # here. Without it the checks only observed and never enforced —
        # metadata.json still wrote a report, but a bad dataset committed
        # anyway. A red run tonight beats a wrong number on the dashboard.
        run: python -m pipeline.run_pipeline --mode live --strict
      - name: Detect decision changes
        id: alerts
        continue-on-error: true
        run: |
          python tools/detect_alerts.py --out alerts.md
          if [ -s alerts.md ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Notify on decision changes
        if: steps.alerts.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A GitHub issue is the notification channel that needs no extra
          # secret: watchers get it by email and on mobile for free.
          TITLE="Signal change — $(date -u +'%d %b %Y')"
          {
            cat alerts.md
            echo
            echo "[Open the dashboard](https://dualmomentum.streamlit.app)"
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md --label signal 2>/dev/null             || gh issue create --title "$TITLE" --body-file body.md

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh sector rotation dataset"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
