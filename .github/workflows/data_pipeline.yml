name: Data Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/processed/**"
  workflow_dispatch:
  schedule:
    # 04:00 IST = 22:30 UTC on the previous calendar day.
    # Run every calendar day; the pipeline uses the latest available market observation,
    # so weekends and NSE holidays naturally fall back to the most recent working day.
    - cron: "30 22 * * *"

concurrency:
  group: sector-rotation-data-pipeline-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live pipeline
        env:
          PIPELINE_MODE: live
        run: python -m pipeline.run_pipeline --mode live
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh sector rotation dataset"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
