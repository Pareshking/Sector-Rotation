name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run canonical backtest parameter matrix
        id: matrix
        continue-on-error: true
        run: |
          python scripts/backtest_parameter_matrix.py \
            --output diagnostic_summary.csv \
            --decisions-output diagnostic_decisions.csv \
            > diagnostic_matrix.log 2>&1
          status=$?
          cat diagnostic_matrix.log
          exit $status
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-parameter-diagnostic
          path: |
            diagnostic_matrix.log
            diagnostic_summary.csv
            diagnostic_decisions.csv
          if-no-files-found: warn
      - name: Fail if diagnostic matrix failed
        if: steps.matrix.outcome == 'failure'
        run: exit 1
